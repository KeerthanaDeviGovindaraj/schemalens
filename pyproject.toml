[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "schemalens"
version = "0.1.0"
description = "Make legacy PostgreSQL databases understandable: docs, lineage, AI explanations, and an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Keerthana Devi Govindaraj" }]
keywords = ["postgresql", "database", "documentation", "lineage", "mcp", "llm"]
dependencies = [
  "pglast>=6",
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
schemalens = "schemalens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/schemalens"]
# Ship the built web UI inside the wheel so `schemalens serve` works after
# `pip install schemalens`. web_dist is git-ignored, so it is listed as an
# artifact to include it when present at build time (see docs/packaging.md).
# Build it first: `cd web && npm run build`, then copy web/dist/* into
# src/schemalens/web_dist/.
artifacts = ["src/schemalens/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Postgres from docker compose"]
filterwarnings = [
  # starlette's TestClient warns about httpx; harmless for our usage
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
